name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      AUTH_ENABLED: "false"
      EXECUTION_MODE: paper
      ALLOW_LIVE_PLACE_ORDER: "false"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Mypy (advisory through Phase 1)
        working-directory: backend
        continue-on-error: true
        run: python -m mypy . --ignore-missing-imports --exclude 'tests/'

      # No Alembic migrations in Phase 0–1 (in-memory paper_sim). Re-enable when
      # Cloud SQL / Railway Postgres schemas land (Phase 2+ / Phase 5).

      - name: Pytest
        run: python -m pytest backend/tests -q --tb=short

      # Remote images: Railway Nixpacks / GCP Cloud Buildpacks (not on this job).
      # Developers never need a local container runtime for PR feedback.
