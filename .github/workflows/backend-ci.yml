name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volatality
          POSTGRES_PASSWORD: volatality_dev
          POSTGRES_DB: volatality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volatality -d volatality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://volatality:volatality_dev@localhost:5432/volatality
      REDIS_URL: redis://localhost:6379/0
      AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -m "not integration"

      - name: Integration tests
        run: pytest -m integration

      # Remote images: Railway Nixpacks / GCP Cloud Buildpacks (not on this job).
      # Developers never need a local container runtime for PR feedback.
