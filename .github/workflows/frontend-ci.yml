name: Frontend CI

on:
  # Manual trigger — lets CI be re-run without an empty commit (e.g. after a
  # GitHub Actions incident abandons a queued run): gh workflow run frontend-ci.yml
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      # `frontend/.env.local` is gitignored, so CI has no env file at all. Both
      # consumers fall back safely (`lib/api.ts` API_URL, `lib/utils.ts`
      # useMockData), but pin an explicit https placeholder so the compile check
      # exercises the same live-data path prod uses rather than the mock path.
      # The real value is injected by Vercel at deploy time — this build is a
      # correctness check only and is never deployed.
      NEXT_PUBLIC_API_URL: https://frontend-ci.invalid

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next build
        run: npm run build

      # No `npm run lint` step: this repo has no ESLint config checked in, so
      # `next lint` drops into its interactive "How would you like to configure
      # ESLint?" prompt and would hang the job rather than fail it. Add the step
      # here once an eslint config lands.
