# Railway paper backend — monorepo root config.
#
# Recommended: Root Directory = `backend`, Config-as-code = `/backend/railway.toml`.
#
# If Root Directory is `backend` but this file is still the config path, deploy
# still works: root requirements.txt lists deps inline (not backend/requirements.txt),
# and start.sh exists under backend/ as well as repo root.
#
# Repo root deploy (Root Directory empty): uses this file + root start.sh.
# Builder: RAILPACK (Railway default; detects Python via ./requirements.txt).

[build]
builder = "RAILPACK"
watchPatterns = ["backend/**", "requirements.txt", "Procfile", "start.sh", "railway.toml"]

[deploy]
startCommand = "bash start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
