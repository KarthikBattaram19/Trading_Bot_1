# Railway paper backend (architecture.md §17.0).
#
# Recommended service settings (isolated monorepo):
#   Root Directory:     backend
#   Config as Code:     /backend/railway.toml
#   Builder:            RAILPACK (Railway default; no Dockerfile)
#
# If Root Directory is left empty, the repo-root railway.toml + start.sh
# are used instead (Railpack needs requirements.txt at the analyzed root).

[build]
builder = "RAILPACK"
watchPatterns = ["**"]

[deploy]
startCommand = "bash scripts/start_remote.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
