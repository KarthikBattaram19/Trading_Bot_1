# Railway paper backend (architecture.md §17.0 / Phase 1.10).
#
# Required service variables (see infra/env/railway.paper.env.example):
#   DEPLOY_STACK=paper
#   EXECUTION_MODE=paper
#   ALLOW_LIVE_PLACE_ORDER=false
# Never set EXECUTION_MODE=live on this stack (M-01 coerces + blocks place_order).
#
# Recommended service settings (isolated monorepo):
#   Root Directory:     backend
#   Config as Code:     /backend/railway.toml
#   Builder:            RAILPACK (Railway default; no Dockerfile)
#
# If Root Directory is left empty, the repo-root railway.toml + start.sh
# are used instead (Railpack needs requirements.txt at the analyzed root).

[build]
builder = "RAILPACK"
watchPatterns = ["**"]

[deploy]
startCommand = "bash start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
